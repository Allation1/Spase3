<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Моя Стилізована Сторінка</title>
    <link rel="stylesheet" href="style.css"> <!-- Підключаємо наш CSS файл -->
</head>
<body>
    <div class="main-container">
        <div id="left-panel" class="side-panel">
            <div class="button-container"></div>
            <div class="info-panel"></div>
        </div>
        <div id="game-map">
            <div id="base"></div>
        </div>
        <div id="right-panel" class="side-panel">
            <div class="button-container">
                <button id="armament-button" class="game-button">Озброєння</button>
            </div>
            <div class="info-panel">
                <div id="armament-list" class="hidden">
                    <div class="armament-item">
                        Легкий кулимет
                        <br>Кінетичний урон: 1
                        <br>Дальність: 10% карти
                        <br>Швидкострільність: 1 постріл/сек
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="game.js"></script>
</body>
</html>
